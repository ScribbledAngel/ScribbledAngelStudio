name: scribbled_angel_studio
description: "A tiny, mobile-first 2D animation studio for making Veritas, one shot at a time."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  record: ^7.1.1
  just_audio: ^0.9.42
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
